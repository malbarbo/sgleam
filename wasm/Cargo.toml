[package]
name = "wasm"
version = "0.9.0"
edition = "2024"

[lib]
name = "sgleam"
crate-type = ["cdylib"]

[features]
# The `run` export, used only by the dual-run integration tests in
# `cli/tests/cli.rs` (via `wasm/sgleam.ts`) and by `wasm/bench`. Not compiled
# into the production binary, which the page drives through `repl_new`. Paired
# with the identically-named feature on the `cli` crate.
wasm-backend = []

[lints]
workspace = true

[dependencies]
engine = { path = "../engine" }
camino = "1.1.9"
gleam-core = { git = "https://github.com/malbarbo/gleam.git", branch = "sgleam-0.9", default-features = false, features = [
    "disable-erlang", "disable-hide-internal",
] }
# The fonts that the frames of a world draw with, which the page registers.
sinteract = { git = "https://github.com/malbarbo/sinteract.git", branch = "master", default-features = false }
