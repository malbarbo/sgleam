[package]
name = "wasm"
version = "0.10.0-dev"
edition = "2024"

[lib]
name = "sgleam"
crate-type = ["cdylib"]

[features]
# Adds the `run` export, which `wasm/sgleam.ts` and `wasm/bench` call. The
# dual-run tests of `cli/tests/cli.rs` go through `wasm/sgleam.ts`. The page
# uses `repl_new`, so the production binary leaves `run` out. The feature of
# the same name in the `cli` crate turns on those tests.
wasm-backend = []

[lints]
workspace = true

[dependencies]
engine = { path = "../engine" }
camino = "1.1.9"
gleam-core = { git = "https://github.com/malbarbo/gleam.git", branch = "sgleam-wasm", default-features = false, features = [
    "disable-erlang", "disable-hide-internal",
] }
# The fonts that the frames of a world draw with, which the page registers.
sinteract = { git = "https://github.com/malbarbo/sinteract.git", branch = "master", default-features = false }
