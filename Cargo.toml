[workspace]
members = ["engine", "cli", "wasm"]
default-members = ["engine", "cli"]
resolver = "2"

# A panic reaches the user as a crash report asking them to file a bug, so what
# it panicked on has to be written where it happened.
[workspace.lints.clippy]
unwrap_used = "deny"
# An index is an assertion the compiler cannot check. Where the bound is
# already at hand, `get` says so in the same expression.
indexing_slicing = "deny"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = 's'

# A test runs each program of the webassembly backend through cranelift, which
# takes seconds per program without optimizations.
[profile.dev.package]
cranelift-assembler-x64.opt-level = 3
cranelift-bforest.opt-level = 3
cranelift-bitset.opt-level = 3
cranelift-codegen.opt-level = 3
cranelift-control.opt-level = 3
cranelift-entity.opt-level = 3
cranelift-frontend.opt-level = 3
regalloc2.opt-level = 3
wasmparser.opt-level = 3
wasmtime.opt-level = 3
wasmtime-environ.opt-level = 3
wasmtime-internal-cranelift.opt-level = 3
