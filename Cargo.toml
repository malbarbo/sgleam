[workspace]
members = ["engine", "cli", "wasm"]
default-members = ["engine", "cli"]
resolver = "2"

# A panic reaches the user as a crash report asking them to file a bug, so what
# it panicked on has to be written where it happened.
[workspace.lints.clippy]
unwrap_used = "deny"
# An index is an assertion the compiler cannot check. Where the bound is
# already at hand, `get` says so in the same expression.
indexing_slicing = "deny"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = 's'

# A static binary has no dlopen. With `--cfg no_dlopen`, the forks link the
# libraries that the crates would open with it.
[patch.crates-io]
dlib = { git = "https://github.com/malbarbo/dlib", branch = "no-dlopen" }
x11-dl = { git = "https://github.com/malbarbo/x11-rs", branch = "no-dlopen" }
x11rb = { git = "https://github.com/malbarbo/x11rb", branch = "no-dlopen" }
