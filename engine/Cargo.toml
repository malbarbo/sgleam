[package]
name = "engine"
version = "0.8.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
camino = "1.1.9"
ecow = "0.2.3"
flate2 = "1"
gleam-core = { git = "https://github.com/malbarbo/gleam.git", branch = "sgleam-0.8", default-features = false, features = [
    "disable-erlang", "disable-hide-internal",
] }
gleam-format = { git = "https://github.com/malbarbo/gleam.git", branch = "sgleam-0.8" }
im = "15.1.0"
indoc = "2.0.5"
path-clean = "1.0.1"
# The box of a path, with each arc as the cubics that sinteract draws.
kurbo = { version = "0.13", default-features = false, features = ["std"] }
rquickjs = { version = "0.12.2", features = ["loader"] }
# debug-embed: without it a debug build reads lib/sgleam from the disk of the
# machine it was built on, so a debug binary anywhere else has no library.
rust-embed = { version = "8.7.2", features = ["debug-embed"] }
# The header and the data URI of a bitmap, the measure of a text, and the
# pixels of an image that image.same compares.
sinteract = { git = "https://github.com/malbarbo/sinteract.git", branch = "master", default-features = false, features = ["pixmap"] }
tar = "0.4.41"
termcolor = "1"
thiserror = "2.0.3"
tracing = "0.1.40"
vec1 = "1.12.1"

[build-dependencies]
flate2 = "1"
tar = "0.4.41"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4.6"
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

[[bench]]
name = "image"
harness = false
