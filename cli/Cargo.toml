[package]
name = "sgleam"
version = "0.9.0"
edition = "2024"
default-run = "sgleam"

[lints]
workspace = true

[dependencies]
engine = { path = "../engine" }
camino = "1.1.9"
bpaf = { version = "0.9", features = ["derive", "bright-color"] }
dirs = "5"
rustyline = { git = "https://github.com/malbarbo/rustyline.git", features = ["derive", "custom-bindings"] }
gleam-core = { git = "https://github.com/malbarbo/gleam.git", branch = "sgleam-0.9", default-features = false, features = [
    "disable-erlang", "disable-hide-internal",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enables the WASM backend in the CLI integration tests: every `run_sgleam_cmd`
# invocation also runs the Deno `wasm/sgleam.ts` wrapper and asserts both
# backends produce identical output. Enabled in CI only on Linux (needs
# wasm32-wasip1 target and Deno installed).
wasm-backend = []

[dev-dependencies]
assert_cmd = "2.1"
indoc = "2.0.5"
insta = "1.41.1"
tempfile = "3"

# tests/server.rs plays the server of a room, with the engine on fd 3 and fd 4.
[target.'cfg(unix)'.dev-dependencies]
command-fds = "0.3"
sinteract = { git = "https://github.com/malbarbo/sinteract.git", branch = "master", default-features = false }
