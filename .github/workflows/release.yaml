name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One target that fails leaves the others to finish, so a flaky run
      # still says which targets build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            setup: sudo apt-get install musl-tools xvfb

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            setup: sudo apt-get install musl-tools xvfb

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            setup: git config --global core.longpaths true

          - os: macos-15-intel
            target: x86_64-apple-darwin
            setup: ""

          - os: macos-15
            target: aarch64-apple-darwin
            setup: ""

    steps:
      - uses: actions/checkout@v7

      - name: Find the version
        shell: bash
        run: |
          # A run started by hand has no tag, so it names the archives after
          # the version of the crate and does not publish them.
          CRATE="v$(sed -n 's/^version = "\([^"]*\)".*/\1/p' cli/Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$CRATE" ]; then
              echo "::error::The tag $GITHUB_REF_NAME differs from the version $CRATE of cli/Cargo.toml"
              exit 1
            fi
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$CRATE"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install dependencies
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      # The static libraries of X11 and Wayland go into the Linux binary,
      # which cannot load them with dlopen. Nix builds them from source, so
      # the cache keeps them until the flake changes.
      - name: Build the static libraries
        if: contains(matrix.target, 'linux-musl')
        uses: ./.github/actions/static-libs
        with:
          target: ${{ matrix.target }}

      - name: Link the static libraries
        if: contains(matrix.target, 'linux-musl')
        # --cfg no_dlopen links X11 and Wayland in winit and softbuffer, and
        # their build scripts find the libraries through pkg-config.
        run: |
          LIBS="$PWD/static-libs/lib"
          {
            echo "SGLEAM_STATIC_LIBS=$LIBS"
            echo "RUSTFLAGS=--cfg no_dlopen"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_LIBDIR=$LIBS/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            ARCHIVE="sgleam-$VERSION-${{ matrix.target }}.zip"
            cp "target/${{ matrix.target }}/release/sgleam.exe" "sgleam.exe"
            7z a "$ARCHIVE" "sgleam.exe"
            rm sgleam.exe
          else
            ARCHIVE="sgleam-$VERSION-${{ matrix.target }}.tar.gz"
            mkdir archive
            cp "target/${{ matrix.target }}/release/sgleam" archive/
            # The licenses of the static libraries ask for their notices in
            # every copy of the binary.
            if ${{ contains(matrix.target, 'linux-musl') }}; then
              cp -r static-libs/share/licenses archive/
            fi
            tar -czvf "$ARCHIVE" -C archive $(ls archive)
            rm -rf archive
          fi

          openssl dgst -r -sha256 -out "$ARCHIVE".sha256 "$ARCHIVE"
          echo "ASSET=$ARCHIVE" >> $GITHUB_ENV

      - name: Ensure binary successfully boots
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              7z x "$ASSET"
              ./sgleam.exe --version ;;
            *)
              tar -xvzf "$ASSET"
              ./sgleam --version ;;
          esac

      - name: Ensure the binary opens a window
        if: contains(matrix.target, 'linux-musl')
        run: |
          cat > window.gleam <<'EOF'
          import sgleam/fill
          import sgleam/image
          import sgleam/world

          pub fn smain() {
            world.create(0, fn(_) { image.square(10, fill.red) })
            |> world.on_tick(fn(n) { n + 1 })
            |> world.stop_when(fn(n) { n == 3 })
          }
          EOF
          xvfb-run -a ./sgleam run -d window window.gleam

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  # The whole matrix publishes through this one job. A release step inside the
  # matrix has every job create the draft at once, and the tag ends up with a
  # draft per job and the archives split among them.
  publish:
    name: Publish the draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Collect every archive
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload release archives
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
